<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assessment - SLM Educator</title>
    <link href="/static/vendor/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/main.css" rel="stylesheet">
    <script src="/static/vendor/dompurify@3.4.16/purify.min.js"></script>
    <script src="/static/vendor/marked@15.0.12/marked.min.js"></script>
    <script src="/static/js/safe-render.js"></script>
    <script src="/static/js/learning-client.js"></script>
    <script src="/static/js/time-display.js"></script>
</head>

<body>

    <!-- Standalone Navbar -->
    <nav class="navbar-standalone">
        <div class="brand">SLM Educator <span class="badge bg-secondary ms-2">Assessment Builder</span></div>
        <div class="actions">
            <button id="save-quiz-btn" class="btn btn-primary" onclick="saveAssessmentDraft()" data-i18n="recovery.save_draft">Save draft</button>
            <a href="/dashboard.html" class="btn btn-close" aria-label="Exit"></a>
        </div>
    </nav>

    <div class="container py-4">
        <!-- Replaced page-header-standalone with standard spacing -->

        <div class="row">

            <div class="row">
                <!-- Settings Column -->
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Settings</h5>
                            <div class="mb-3">
                                <label class="form-label" for="quiz-title">Title</label>
                                <input type="text" class="form-control" id="quiz-title" placeholder="e.g. Unit 1 Quiz">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="quiz-desc">Description</label>
                                <textarea class="form-control" id="quiz-desc" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="quiz-pass">Passing Score (%)</label>
                                <input type="number" class="form-control" id="quiz-pass" value="70">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="grading-mode">Grading Mode</label>
                                <select class="form-select" id="grading-mode">
                                    <option value="ai_assisted" selected>🤖 AI-Assisted (AI suggests, you review)
                                    </option>
                                    <option value="ai_automatic" data-i18n="recovery.ai_review_required">AI suggestions (teacher review required)</option>
                                    <option value="manual">✍️ Manual (You grade subjective questions)</option>
                                </select>
                                <small class="text-muted">
                                    Multiple choice and True/False are always auto-graded.
                                </small>
                            </div>
                            <div class="mb-3"><label for="quiz-time" data-i18n="recovery.time_limit">Time limit (minutes, blank for none)</label><input id="quiz-time" type="number" min="1" max="1440" class="form-control"></div>
                            <div class="mb-3"><label for="quiz-attempts" data-i18n="recovery.attempt_limit">Maximum attempts</label><input id="quiz-attempts" type="number" min="1" max="100" value="1" class="form-control"></div>
                            <div class="mb-3">
                                <label for="assessment-assistance" class="form-label" data-i18n="recovery.assessment_assistance">AI help during an open attempt</label>
                                <select id="assessment-assistance" class="form-select" aria-describedby="assistance-policy-help">
                                    <option value="hints_only" data-i18n="recovery.policy_hints_only">Hints only</option>
                                    <option value="explanations" data-i18n="recovery.policy_explanations">Hints and explanations</option>
                                    <option value="disabled" data-i18n="recovery.policy_disabled">AI help disabled</option>
                                </select>
                                <small id="assistance-policy-help" class="text-muted" data-i18n="recovery.policy_help">Applies while the learner has an open attempt. If several attempts are open, the strictest policy applies.</small>
                                <button id="retry-assistance-policy" type="button" class="btn btn-sm btn-outline-secondary d-none mt-2" onclick="loadAssessmentAssistancePolicy()" data-i18n="recovery.retry_policy">Retry loading policy</button>
                            </div>
                            <div class="d-grid mb-3">
                                <button class="btn btn-outline-primary" onclick="openRubricModal()">+ Add
                                    Rubric</button>
                            </div>
                            <div class="d-grid mb-2">
                                <button id="preview-btn" class="btn btn-outline-info" onclick="previewAssessment()">
                                    Preview</button>
                            </div>
                            <div class="d-grid">
                                <button id="save-draft-btn" class="btn btn-primary mb-2" onclick="saveAssessmentDraft()" data-i18n="recovery.save_draft">Save draft</button>
                                <button id="publish-btn" class="btn btn-success" onclick="publishAssessment()" disabled data-i18n="recovery.review_publish">Publish reviewed assessment</button>
                            </div>
                            <div id="assessment-feedback" class="d-none" role="status" aria-live="polite"></div>
                        </div>
                    </div>
                </div>

                <!-- Questions Column -->
                <div class="col-md-8">
                    <div id="questions-container">
                        <!-- Questions appear here -->
                    </div>

                    <button type="button" class="card border-dashed mt-3 w-100" onclick="addQuestionUI()">
                        <div class="card-body text-center">
                            <span class="h5 text-muted mb-0">+ Add Question</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Question Template (Hidden) -->
        <template id="question-template">
            <div class="question-card question-item">
                <div class="d-flex justify-content-between align-items-start">
                    <span class="drag-handle me-2" style="cursor: grab; font-size: 1.2rem;"
                        title="Drag to reorder">≡</span>
                    <input type="text" class="form-control form-control-lg mb-2 question-text flex-grow-1"
                        placeholder="Question Text">
                    <button class="btn btn-icon btn-danger-soft ms-2 remove-q" title="Remove Question">
                        ✕
                    </button>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <select class="form-select question-type" onchange="toggleOptions(this)">
                            <option value="multiple_choice">Multiple Choice</option>
                            <option value="true_false">True/False</option>
                            <option value="short_answer">Short Answer</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <input type="number" class="form-control points" value="10" placeholder="Points">
                    </div>
                </div>

                <!-- Options Container -->
                <div class="options-container mt-3">
                    <label class="form-label">Correct Answer:</label>
                    <input type="text" class="form-control correct-answer" placeholder="Exact text match">
                    <small class="text-muted">For Multiple Choice, enter the correct option text exactly.</small>

                    <div class="mc-options mt-2">
                        <label class="form-label">Options (comma separated):</label>
                        <input type="text" class="form-control options-list" placeholder="Option A, Option B, Option C">
                    </div>
                </div>
            </div>
        </template>

        <!-- Rubric Modal -->
        <div class="modal fade" id="rubricModal" tabindex="-1" aria-hidden="true" aria-labelledby="rubric-title">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 id="rubric-title" class="modal-title">Edit Rubric</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="rubric-form">
                            <div class="mb-3">
                                <label class="form-label" for="rubric-name">Rubric Name</label>
                                <input type="text" class="form-control" id="rubric-name"
                                    placeholder="e.g. Essay Grading">
                            </div>
                            <div id="rubric-section">
                                <!-- Criteria go here -->
                            </div>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addCriterionUI()">+
                                Add
                                Criterion</button>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Save Rubric</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Criterion Template -->
        <template id="criterion-template">
            <div class="criterion-item border p-3 mb-2 rounded bg-elevated">
                <div class="d-flex justify-content-between mb-2">
                    <input type="text" class="form-control me-2 criterion-name"
                        placeholder="Criterion Name (e.g. Clarity)">
                    <input type="number" class="form-control points-input" placeholder="Points" value="10">
                    <button type="button" class="btn-close ms-2"
                        onclick="this.closest('.criterion-item').remove()"></button>
                </div>
                <textarea class="form-control criterion-desc" rows="2"
                    placeholder="Description of expectations..."></textarea>
            </div>
        </template>

        <script src="/static/vendor/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/static/vendor/sortablejs@1.15.0/Sortable.min.js"></script>
        <script src="/static/js/theme.js"></script>
        <script src="/static/js/i18n.js"></script>
        <script src="/static/js/toast.js"></script>
        <script type="module" src="/static/js/auth.js?v=20260204"></script>
        <script src="/static/js/assessment_builder.js"></script>
</body>

</html>
