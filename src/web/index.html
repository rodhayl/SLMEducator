<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLM Educator</title>
    <link href="/static/vendor/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="/static/vendor/dompurify@3.4.16/purify.min.js"></script>
    <script src="/static/vendor/marked@15.0.12/marked.min.js"></script>
    <script src="/static/js/safe-render.js"></script>
    <script src="/static/js/learning-client.js"></script>
    <script src="/static/js/time-display.js"></script>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>SLM Educator</h2>
            <p class="text-center text-muted" data-i18n="recovery.welcome">Your courses, practice and feedback in one place.</p>
            <div id="status" role="status" class="card p-3 text-center" data-i18n="recovery.server_checking">Checking API connection...</div>
            <div class="auth-links mt-4">
                <a href="/login.html" class="btn btn-primary w-100" data-i18n="recovery.log_in">Log in</a>
            </div>
        </div>
    </div>
    <script>
        fetch('/api/status')
            .then(response => { if (!response.ok) throw new Error('Unavailable'); return response.json(); })
            .then(data => {
                const statusEl = document.getElementById('status');
                statusEl.dataset.i18n = 'recovery.server_available';
                statusEl.textContent = SLMClient.message('server_available', 'Ready to sign in');
                statusEl.classList.add('bg-success', 'text-white');
            })
            .catch(error => {
                const statusEl = document.getElementById('status');
                statusEl.dataset.i18n = 'recovery.server_unavailable';
                statusEl.textContent = SLMClient.message('server_unavailable', 'The server is unavailable. Start the application and retry.');
                statusEl.classList.add('bg-danger', 'text-white');
            });
    </script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script>
        // Register Service Worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('[App] Service Worker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('[App] Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>

</html>
