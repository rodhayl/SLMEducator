name: Synthetic offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLM_OFFLINE_TESTS: "1"
      USE_REAL_AI: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Install pinned test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          npm ci --ignore-scripts --prefix tests/ui
      - name: Check critical Python syntax and names
        run: python -m flake8 src scripts tests --select E9,F63,F7,F82
      - name: Type-check audited domain contracts
        run: >-
          python -m mypy src/core/services/course_workflow.py
          src/core/services/generation_workflow.py
          src/core/services/settings_config_service.py
          src/core/services/progress_tracking_service.py
      - name: Run synthetic API, service and packaging checks
        run: >-
          python -m pytest tests -q -ra --strict-markers
          --ignore=tests/manual --ignore=tests/e2e --ignore=tests/real_ai
          -m "not real_ai"
          --cov=src --cov-report=term --cov-fail-under=80
          --basetemp="${RUNNER_TEMP}/slm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run serial DOM regressions
        run: npm test --prefix tests/ui
