name: Isolated browser acceptance
on:
  push:
    branches: [feat/local-acceptance-recovery-20261004, feat/assessment-browser-acceptance-20261005]
    paths: ['src/**', 'tests/browser/**', 'requirements*.txt', '.github/workflows/browser-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SLM_BROWSER_ACCEPTANCE: '1'
      SLM_OFFLINE_TESTS: '0'
      USE_REAL_AI: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install official browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run isolated real Chromium journeys
        run: SLM_BROWSER_ARTIFACTS="${RUNNER_TEMP}/slm-browser-artifacts" python -m pytest tests/browser -q --strict-markers --basetemp="${RUNNER_TEMP}/slm-browser-${GITHUB_RUN_ID}"
      - name: Preserve synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-browser-screenshots
          path: ${{ runner.temp }}/slm-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
